spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.web.error.include-binding-errors=always
spring.web.error.include-message=always

spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=${RABBITMQ_PORT}
spring.rabbitmq.username=${RABBITMQ_USER}
spring.rabbitmq.password=${RABBITMQ_PASS}

app.rabbitmq.exchange=pagamentos.exchange
app.rabbitmq.routingkey.pagamento-criado=pagamento.criado

jwt.validity=${JWT_VALIDITY}
jwt.secret=${JWT_SECRET}


# Credenciais SEMPRE por variável de ambiente (nunca commitar senha no repositório)
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

app.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}
app.mail.nome-remetente=Conecta Estetica

# Link do front-end que recebe o token (ex.: http://localhost:5173/redefinir-senha?token=...)
app.frontend-url=${FRONTEND_URL}
app.recuperacao-senha.expiracao-minutos=30
